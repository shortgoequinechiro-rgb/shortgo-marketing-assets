name: Sunday Static-Post Agent

on:
  schedule:
    # Sunday 4:34am Central Time = 09:34 UTC (works year-round; ignores DST nuance)
    - cron: '34 9 * * 0'
  workflow_dispatch: {}   # allow manual triggering for testing

permissions:
  contents: write   # to commit rendered images + state changes

jobs:
  draft-render-schedule-and-email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Sanity-check required files
        run: |
          test -f business-context.md
          test -f content-log.md
          test -d photo-library
          test -d lib
          ls photo-library/*.png | head -5

      - name: Run Sunday agent
        env:
          ANTHROPIC_API_KEY:        ${{ secrets.ANTHROPIC_API_KEY }}
          META_PAGE_ACCESS_TOKEN:   ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID:             ${{ secrets.META_PAGE_ID }}
          META_IG_USER_ID:          ${{ secrets.META_IG_USER_ID }}
          RESEND_API_KEY:           ${{ secrets.RESEND_API_KEY }}
          NOTIFY_TO_EMAIL:          ${{ secrets.NOTIFY_TO_EMAIL }}
          NOTIFY_FROM_EMAIL:        ${{ secrets.NOTIFY_FROM_EMAIL }}
          NOTIFY_FROM_NAME:         "Short Go Agent"
        run: |
          cd "${GITHUB_WORKSPACE}"
          python lib/sunday_cloud_agent.py

      - name: Commit rendered posts + state
        run: |
          git config user.name "Short Go Agent"
          git config user.email "shortgoequinechiro@gmail.com"
          git add posts/ previews/ state/ content-log.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Sunday agent run $(date -u +%Y-%m-%d)"
            git push
          fi
